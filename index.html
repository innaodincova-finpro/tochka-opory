<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Точка опоры — кабинет специалиста</title>
<meta name="theme-color" content="#28425C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F8FA; --card:#fff; --soft:#F7FAFC; --panel:#28425C; --panel2:#1E3348;
  --panel-text:#DCE6F0; --accent:#3E6B8F; --accent-soft:#E4EDF5; --ochre:#B08347; --ochre-soft:#F6EEE1;
  --ink:#22303F; --ink2:#4A5D71; --ink3:#7C8DA0; --line:#D9E2EA; --line2:#E8EEF4;
  --warn:#A85147; --warn-soft:#F8ECE5; --good:#4B7F62; --good-soft:#E6F0EA;
  --shadow:0 1px 2px rgba(28,43,58,.05),0 8px 24px -14px rgba(28,43,58,.25);
}
html[data-theme="dark"]{
  --ground:#111820; --card:#19222B; --soft:#212E3A; --panel:#16222E; --panel2:#0B131B;
  --panel-text:#C6D5E4; --accent:#7FAAD0; --accent-soft:#233444; --ochre:#D0A469; --ochre-soft:#2E2617;
  --ink:#E4EBF2; --ink2:#B0C0CF; --ink3:#8496A7; --line:#2C3B49; --line2:#25333F;
  --warn:#DB9289; --warn-soft:#33241C; --good:#7FB795; --good-soft:#1C2C24;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Spectral',Georgia,serif;margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ── Боковая панель ── */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;min-width:0}
.shell>*{min-width:0}
.col{display:flex;flex-direction:column;min-width:0}
header.app{background:var(--panel);color:var(--panel-text);padding:16px 13px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px}
.brand b{display:block;font-family:'Spectral',serif;font-size:17px;color:#fff;font-weight:600;line-height:1.2}
html[data-theme="dark"] .brand b{color:var(--ink)}
.brand span{font-size:11.5px;opacity:.7}
.star{width:24px;height:24px;flex:none}
.rolebox{display:grid;gap:8px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.14)}
.rolebox .who{font-size:12.5px;line-height:1.35;color:var(--panel-text)}
.rolebox .who b{display:block;color:#fff;font-size:13.5px;font-family:'Spectral',serif}
html[data-theme="dark"] .rolebox .who b{color:var(--ink)}
.rolebox .who span{font-size:11.5px;opacity:.7}
nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
nav.tabs button{background:transparent;border:0;color:var(--panel-text);padding:8px 11px;border-radius:8px;cursor:pointer;text-align:left;width:100%;font-size:14px;opacity:.85}
nav.tabs button:hover{background:rgba(255,255,255,.09);opacity:1}
nav.tabs button.on{background:var(--accent);color:#fff;opacity:1;font-weight:500}
html[data-theme="dark"] nav.tabs button.on{color:#0B131B}
.railfoot{display:grid;gap:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--panel-text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;text-align:left}
.hbtn:hover:not(:disabled){border-color:var(--ochre);color:var(--ochre)}
.hbtn:disabled{opacity:.35;cursor:default}
.save{font-size:11.5px;opacity:.75;display:flex;align-items:center;gap:6px;padding:2px 2px}
.save i{width:7px;height:7px;border-radius:50%;background:#7FB795;flex:none}
.save.wait i{background:#C08463}
.save.fail i{background:var(--warn)}
.save.fail{opacity:1;font-weight:600}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  header.app{height:auto;position:static;flex-direction:row;align-items:center;gap:10px;overflow:visible;padding:9px 12px;flex-wrap:wrap;min-width:0}
  .brand span{display:none}
  .rolebox{display:flex;flex-wrap:wrap;border-bottom:0;padding-bottom:0;gap:6px}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:3px;order:3;width:100%;min-width:0;flex-basis:100%}
  nav.tabs button{width:auto;white-space:nowrap}
  .railfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;border-top:0;padding-top:0;margin-left:auto}
  .save{display:flex;order:4;font-size:11px;white-space:nowrap}
}

main{max-width:1180px;margin:0 auto;padding:20px 20px 80px;width:100%}
.card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:21px;margin-bottom:2px}
.card h3{font-size:16px;margin:20px 0 8px}
.card h3:first-of-type{margin-top:6px}
.sub{color:var(--ink3);font-size:13px}
.lead{color:var(--ink2);font-size:14.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* ── Кнопки ── */
.btn{background:var(--accent);color:#fff;border:0;padding:9px 15px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{filter:brightness(1.08)}
/* Тёмный текст задаётся только залитым кнопкам: правило для всех .btn перебивало
   цвет контурных, и в тёмной теме их надписи сливались с фоном карточки. */
html[data-theme="dark"] .btn:not(.ghost){color:#0B131B}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
html[data-theme="dark"] .btn.ghost{color:var(--ink)}
.btn.mini{padding:5px 10px;font-size:13px;border-radius:7px}
/* Красной кнопке нужен свой белый текст: класс warn сочетается с ghost, и надпись
   от контурной кнопки оказывалась серо-синей на кирпичном фоне. */
.btn.warn,.btn.warn.ghost{background:var(--warn);color:#fff;border-color:transparent}
.btn.warn:hover,.btn.warn.ghost:hover{border-color:transparent;color:#fff}
/* В тёмной теме красный светлее фона, поэтому надпись на нём тёмная. */
html[data-theme="dark"] .btn.warn,html[data-theme="dark"] .btn.warn.ghost,
html[data-theme="dark"] .btn.warn:hover{background:var(--warn);color:#20100D;border-color:transparent}
.btn:focus-visible,nav.tabs button:focus-visible,.hbtn:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

/* ── Плашки ── */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.chip.b{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.o{background:var(--ochre-soft);color:var(--ochre);border-color:transparent}
.chip.g{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.r{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* ── Числа ── */
.kpi{background:var(--soft);border:1px solid var(--line2);border-radius:11px;padding:12px 14px}
.kpi .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--ochre);font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.kpi.alert .v{color:var(--warn)}
.kpi.ok .v{color:var(--good)}

/* ── Таблицы ── */
.tw{overflow-x:auto;border:1px solid var(--line2);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--soft);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ── Формы ── */
label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:12px;color:var(--ink3);margin-bottom:3px;letter-spacing:.03em}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* ── Расписание ── */
.day{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:stretch}
.slot .t{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink3);padding-top:12px}
.ev{background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;cursor:pointer}
.ev:hover{border-color:var(--accent)}
.ev .n{font-weight:600}
.ev .d{font-size:13px;color:var(--ink2)}
.ev.done{border-left-color:var(--good);opacity:.92}
.ev.no{border-left-color:var(--warn);background:var(--warn-soft)}
.ev.wait{border-left-color:var(--ochre)}
.gap{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--ink3);font-size:13.5px;background:transparent;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ── Линия дня ── */
.line{position:relative;padding-left:66px}
.line::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.hr{position:relative;min-height:46px;padding:3px 0}
.hr .hl{position:absolute;left:-66px;top:2px;width:44px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink3)}
.hr .dot{position:absolute;left:-18px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--card)}
.hr.has .dot{background:var(--accent)}
.hr.past{opacity:.55}
.hr.past .dot{background:var(--line)}
.hr .free{color:var(--ink3);font-size:13px;padding:4px 0}
.now{position:relative;height:0;margin:2px 0}
.now::before{content:"";position:absolute;left:-20px;right:0;top:0;height:2px;background:#C08463;border-radius:2px}
.now span{position:absolute;right:0;top:-9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#C08463;background:var(--card);padding:0 7px;font-weight:600}
.today{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start}
@media(max-width:900px){.today{grid-template-columns:1fr;gap:16px}}
.side-block{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.side-block h3{font-size:15px;margin:0 0 10px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.stat:first-of-type{border-top:0}
.stat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ochre);font-variant-numeric:tabular-nums;line-height:1.1}
.todo{display:grid;gap:7px}
.todo .t{background:var(--soft);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink2)}
.todo .t b{color:var(--ink)}
.todo .t .btn{margin-top:6px}
/* ── Полоса идущей встречи ── */
.meetwrap{position:sticky;top:0;z-index:35;min-width:0}
.meetbar{background:#C08463;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;
  box-shadow:0 4px 14px rgba(0,0,0,.16)}
.meetbar .mt{font-size:13.5px;line-height:1.35;flex:1;min-width:180px}
.meetbar .mt b{font-weight:600}
.meetbar .mt .mm{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.meetbar .ma{display:flex;gap:6px;flex-wrap:wrap}
.meetbar button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);color:#fff;padding:5px 10px;
  border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.meetbar button:hover{background:rgba(255,255,255,.3)}
.meetbar button.pri{background:#fff;color:#8A4F2E;border-color:#fff;font-weight:600}
@media(max-width:640px){.meetbar{padding:8px 11px}.meetbar .mt{min-width:100%}.meetbar button{font-size:12px;padding:5px 8px}}
@media(max-width:640px){.line{padding-left:52px}.line::before{left:40px}.hr .hl{left:-52px;width:34px;font-size:11.5px}.hr .dot{left:-16px}
  /* Плашка «сейчас» была растянута на всю ширину строки и своим фоном закрывала подпись часа. */
  .now span{left:0;right:auto}}

/* ── Модальное ── */
.modal{position:fixed;inset:0;background:rgba(16,26,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:100}
.modal[hidden]{display:none}
.sheet{background:var(--ground);border-radius:16px;max-width:820px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto}
.sheet .sh{background:var(--panel);color:#fff;padding:14px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
html[data-theme="dark"] .sheet .sh{color:var(--ink)}
.sheet .sh h3{font-size:18px}
.sheet .sb{padding:18px 20px}
.sheet .sf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:transparent;border:0;color:inherit;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}

/* ── Выноски ── */
.note{border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.alertbox{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.okbox{border-left:3px solid var(--good);background:var(--good-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}

/* ── Прочее ── */
.bar{height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar > i.o{background:var(--ochre)}
.bar > i.r{background:var(--warn)}
.list{display:grid;gap:8px}
.item{background:var(--soft);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--panel);color:#fff;padding:10px 18px;border-radius:10px;z-index:200;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
@media(max-width:640px){
  main{padding:12px 10px 70px}.card{padding:15px 13px;border-radius:12px}
  .slot{grid-template-columns:46px 1fr}.sheet .sb{padding:14px}
}

/* ── Дополнения кабинета: роли, шкалы, график ── */
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;background:transparent;border:0;color:var(--panel-text);padding:5px 4px;border-radius:7px;cursor:pointer;font-size:11.5px;white-space:nowrap;text-align:center;letter-spacing:-.01em}
.seg button.on{background:var(--ochre);color:#20303F;font-weight:600}
.hbtn.on{border-color:var(--ochre);color:var(--ochre);background:rgba(176,131,71,.16)}
.hsel{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--panel-text);border-radius:8px;padding:5px 8px;font-size:12.5px;width:100%}
.hsel option{color:var(--ink);background:var(--card)}
@media(max-width:900px){.hsel{width:auto;max-width:150px}.seg button{flex:none}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
.opts label{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:7px 5px;cursor:pointer;background:var(--card);color:var(--ink2);line-height:1.3}
.opts input{width:auto;margin:0;flex:none}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.q{border-bottom:1px solid var(--line2);padding:11px 0}
.q:last-of-type{border-bottom:0}
.q .qt{font-size:14.5px}
.q .qn{color:var(--ink3);font-family:'IBM Plex Mono',monospace;font-size:13px;margin-right:6px}
.q.hl{background:var(--ochre-soft);border-radius:9px;padding:11px 12px;border-bottom:0;margin:6px 0}
.chartbox{overflow-x:auto;border:1px solid var(--line2);border-radius:11px;background:var(--soft);padding:10px}
.chartbox svg{display:block;width:100%;min-width:430px;height:auto}
.chartbox{scrollbar-width:thin}
.chart-hint{margin:4px 0 0}
.stack{display:grid;gap:10px}
.split{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gate{border:1px dashed var(--line);border-radius:11px;padding:14px 16px;background:var(--soft);color:var(--ink2);font-size:14px}
.gate b{color:var(--ink)}
.tline{display:grid;gap:0}
.tline .tl{display:grid;grid-template-columns:78px 1fr;gap:10px;border-left:2px solid var(--line);margin-left:6px;padding:0 0 12px 12px}
@media(max-width:520px){.opts{grid-template-columns:1fr 1fr}.tline .tl{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>

<div class="shell">
<header class="app">
  <div class="brand">
    <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="#B08347" d="M12 1.5l2.2 6.1 6.3.6-4.7 4.2 1.4 6.2L12 15.4l-5.2 3.2 1.4-6.2L3.5 8.2l6.3-.6z"/></svg>
    <div><b>Точка опоры</b><span>кабинет специалиста · редакция от 27.08.2026</span></div>
  </div>
  <div class="rolebox" id="rolebox"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="railfoot">
    <button class="hbtn" id="back" disabled>← Назад</button>
    <button class="hbtn" id="undo" disabled>↶ Отменить</button>
    <button class="hbtn" id="redo" disabled>↷ Повторить</button>
    <div class="save" id="save"><i></i><span>сохранено</span></div>
    <button class="hbtn" id="theme">Тема</button>
  </div>
</header>
<div class="col">
  <div class="meetwrap" id="meetbar"></div>
  <main id="view"></main>
</div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ═══════════════ Данные ═══════════════ */
const KEY='tochka-opory-v1';
const D=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const ru=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const rub=n=>(Math.round(n||0)).toLocaleString('ru-RU')+' ₽';
const uid=()=>Math.random().toString(36).slice(2,9);

/* ═══════════════ График динамики ═══════════════ */
function lineChart(pts,kind,events){
  const cfg=SCALES[kind];if(!pts.length)return '<p class="sub">Замеров пока нет.</p>';
  const W=680,H=230,PL=36,PR=18,PT=14,PB=34,iw=W-PL-PR,ih=H-PT-PB;
  const t0=new Date(pts[0].date),t1=new Date(pts[pts.length-1].date);
  const span=Math.max(1,(t1-t0)/864e5);
  const X=d=>pts.length<2?PL+iw/2:PL+iw*((new Date(d)-t0)/864e5)/span;
  const Y=v=>PT+ih*(1-v/cfg.max);
  let g='';
  g+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+ih}" stroke="var(--line)" stroke-width="1"/>`;
  g+=`<line x1="${PL}" y1="${PT+ih}" x2="${PL+iw}" y2="${PT+ih}" stroke="var(--line)" stroke-width="1"/>`;
  cfg.thr.forEach(t=>{
    g+=`<line x1="${PL}" y1="${Y(t).toFixed(1)}" x2="${PL+iw}" y2="${Y(t).toFixed(1)}" stroke="var(--ochre)" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>`;
    /* Подпись порога стояла в поле справа и на узком экране оставалась за краем — переносим внутрь графика. */
    g+=`<text x="${PL+iw-4}" y="${(Y(t)-4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ochre)">порог ${t}</text>`;
  });
  [0,cfg.max].forEach(v=>{g+=`<text x="${PL-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink3)">${v}</text>`});
  (events||[]).forEach(e=>{
    if(new Date(e.d)<t0||new Date(e.d)>t1)return;
    const x=X(e.d).toFixed(1);
    const w=esc(e.t).length*5.2;
    const an=(+x-w/2)<PL?'start':(+x+w/2)>PL+iw?'end':'middle';
    const tx=an==='start'?PL:an==='end'?PL+iw:x;
    g+=`<line x1="${x}" y1="${PT}" x2="${x}" y2="${PT+ih}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>`;
    g+=`<text x="${tx}" y="${PT+ih+27}" text-anchor="${an}" font-size="10" fill="var(--accent)">${esc(e.t)}</text>`;
  });
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.score).toFixed(1)).join(' ');
  g+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  let lastLbl=-99;
  pts.forEach((p,i)=>{
    const x=X(p.date).toFixed(1),y=Y(p.score).toFixed(1);
    const an=(+x+12)>PL+iw?'end':'middle',ax=an==='end'?PL+iw:x;
    g+=`<circle class="pt" cx="${x}" cy="${y}" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.2"/>`;
    g+=`<text x="${ax}" y="${(+y-10).toFixed(1)}" text-anchor="${an}" font-size="11.5" font-weight="600" fill="var(--ink)">${p.score}</text>`;
    if(+x-lastLbl>=34||i===pts.length-1){
      lastLbl=+x;
      const dan=(+x-14)<PL?'start':(+x+14)>PL+iw?'end':'middle';
      const dx=dan==='start'?PL:dan==='end'?PL+iw:x;
      g+=`<text x="${dx}" y="${PT+ih+14}" text-anchor="${dan}" font-size="10" fill="var(--ink3)">${ru(p.date).slice(0,5)}</text>`;
    }
  });
  return `<div class="chartbox" data-chart="1"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Динамика ${kind}">${g}</svg></div>
    <p class="sub chart-hint" hidden>График шире экрана: он прокручивается вбок. Показан правый край — самые свежие замеры.</p>`;
}

function pushUndo(label){try{UNDO.push({s:JSON.stringify(S),label:label||''});if(UNDO.length>20)UNDO.shift();REDO.length=0;syncRail()}catch(e){}}

}
/* Обезличивание текста запроса.
   Раньше искалось только точное совпадение с написанием в карточке, поэтому «Мариной Соколовой»,
   одна фамилия, телефон через 8 и адрес почты уходили в буфер как есть.
   Теперь имя ищется по основе слова (все падежи), телефон — в любом написании, почта — вырезается. */
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function anonStem(w){return /[аеёиоуыэюяьйъ]$/i.test(w)&&w.length>4?w.slice(0,-1):w}
function anonName(out,name,repl){
  if(!name)return out;
  String(name).split(/[\s,]+/).filter(w=>w.length>=3).forEach(w=>{
    const re=new RegExp('(^|[^А-Яа-яЁёA-Za-z-])('+reEsc(anonStem(w))+'[а-яё]{0,3})(?![А-Яа-яЁёA-Za-z])','gi');
    out=out.replace(re,'$1'+repl)});
  return out;
}
function anon(t){
  let out=String(t);const reps=['законный представитель'];
  S.clients.forEach(c=>{
    const code=c.code||'клиент';reps.push(code);
    out=anonName(out,c.name,code);
    if(c.guardian)out=anonName(out,c.guardian.name,'законный представитель')});
  /* Телефон в любом написании: +7, 7, 8, скобки, дефисы, пробелы, точки. */
  out=out.replace(/\+?\d(?:[\s()\-–.]*\d){9,14}/g,'—');
  /* Адрес электронной почты не вырезался вовсе — он указывает на человека не хуже имени. */
  out=out.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'—');
  /* «Мариной Соколовой» превращается в два одинаковых кода подряд — оставляем один. */
  [...new Set(reps)].forEach(r=>{const e=reEsc(r);
    out=out.replace(new RegExp('(?:'+e+')(?:\\s+(?:'+e+'))+','g'),r)});
  return out;
}

/* ═══════════════ Выгрузка в Word ═══════════════ */
function toWord(name,html){
  const doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    +'<head><meta charset="utf-8"><title>'+name+'</title><style>'
    +'body{font-family:Georgia,serif;font-size:11pt;color:#1a1a1a}h1{font-size:16pt}h2{font-size:13pt;margin-top:18pt}'
    +'table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5pt 7pt;font-size:10pt;text-align:left}'
    +'th{background:#eef2f6}.muted{color:#666;font-size:9.5pt}</style></head><body>'+html+'</body></html>';
  const blob=new Blob(['\ufeff'+doc],{type:'application/msword'});
  const safe=String(name).replace(/[^0-9A-Za-z_-]+/g,'-').replace(/^-+|-+$/g,'')||'dokument';
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safe+'.doc';a.click();
  toast('Файл готов — откроется в Word');
}

function dayRail(date){
  const st=parseInt(S.settings.start),en=parseInt(S.settings.end);
  const list=S.sessions.filter(v=>v.date===date&&!v.status.startsWith('отменена')&&v.status!=='перенесена')
    .sort((a,b)=>a.time<b.time?-1:1);
  const now=date===D(0)?nowMin():-1;
  let html='';
  for(let h=st;h<en;h++){
    const from=h*60,to=from+60;
    const evs=list.filter(v=>{const m=toMin(v.time);return m>=from&&m<to});
    const busyHere=list.some(v=>{const m=toMin(v.time);return m<to&&m+v.dur>from});
    const past=now>=0&&to<=now;
    const nowline=(now>=from&&now<to)?`<div class="now"><span>сейчас ${fmt(now)}</span></div>`:'';
    let inner=evs.map(evCard).join('');
    const ongoing=list.find(v=>{const m=toMin(v.time);return m<from&&m+v.dur>from});
    if(!evs.length)inner=busyHere
      ? `<div class="free">продолжается встреча${ongoing?' · '+esc(title(ongoing)):''}</div>`
      : `<div class="free">свободно · <button class="btn mini ghost" data-act="newSess" data-date="${date}" data-time="${fmt(from)}">записать</button>
         <button class="btn mini ghost" data-act="wait" data-date="${date}" data-time="${fmt(from)}">предложить листу ожидания</button></div>`;
    html+=`<div class="hr ${evs.length?'has':''} ${past?'past':''}"><div class="hl">${fmt(from)}</div><div class="dot"></div>${nowline}${inner}</div>`;
  }
  return html;
}

/* ═══════════════ Отчёты ═══════════════ */
function repData(){
  const win=90;
  const inWin=v=>days(v.date,D(0))<=win&&days(v.date,D(0))>=0;
  const all=S.sessions.filter(inWin);
  const done=all.filter(v=>v.status==='состоялась');
  const cancEarly=all.filter(v=>v.status==='отменена клиентом'&&v.before>=S.settings.cancelH);
  const cancLate=all.filter(v=>v.status==='отменена клиентом'&&v.before<S.settings.cancelH);
  const cancSpec=all.filter(v=>v.status==='отменена специалистом');
  const noShow=all.filter(v=>v.status==='неявка');
  const missed=cancEarly.concat(cancLate,cancSpec,noShow);
  const lost=missed.reduce((s,v)=>s+v.price,0)-missed.reduce((s,v)=>s+(v.charged||0),0);
  const m30=S.sessions.filter(v=>v.status==='состоялась'&&days(v.date,D(0))<=30&&days(v.date,D(0))>=0);
  const doneH=m30.reduce((s,v)=>s+v.fact,0)/60;
  const openH=S.settings.openH||1;
  const started=S.clients.filter(c=>doneSess(c.id).length>=1);
  const firsts=S.clients.filter(c=>doneSess(c.id).some(v=>v.type==='первичная'));
  const second=firsts.filter(c=>doneSess(c.id).length>=2);
  const keep=started.filter(c=>doneSess(c.id).length>=5);
  const dur=c=>{const l=doneSess(c.id);return l.length>1?days(l[0].date,l[l.length-1].date):0};
  const byWhy={};
  S.clients.filter(c=>c.status==='завершён'||c.status==='прервал'||c.status==='пауза').forEach(c=>{
    const k=c.endWhy||c.status;(byWhy[k]=byWhy[k]||[]).push(dur(c))});
  let gapSum=0,gapN=0;
  S.clients.forEach(c=>{const l=doneSess(c.id);for(let i=1;i<l.length;i++){gapSum+=days(l[i-1].date,l[i].date);gapN++}});
  const oblig=S.packs.reduce((s,p)=>s+Math.max(0,p.n-p.used)*p.price,0);
  const income=done.reduce((s,v)=>s+(v.price||0),0);
  const paid=S.pays.filter(x=>days(x.date,D(0))<=win&&days(x.date,D(0))>=0).reduce((s,x)=>s+x.sum,0);
  return {income,paid,win,all,done,cancEarly,cancLate,cancSpec,noShow,missed,lost,m30,doneH,openH,started,firsts,second,keep,byWhy,
    gap:gapN?Math.round(gapSum/gapN):0,oblig};
}
function vRep(){
  const r=repData();
  const fill=r.openH?Math.round(r.doneH/r.openH*100):0;
  const pct=n=>r.all.length?Math.round(n/r.all.length*100):0;
  const nsPct=pct(r.noShow.length);
  const conv=r.firsts.length?Math.round(r.second.length/r.firsts.length*100):0;
  const ret=r.started.length?Math.round(r.keep.length/r.started.length*100):0;
  return `<div class="card">
    <div class="spread"><div><h2>Отчёты</h2></div>
    <button class="btn ghost" data-act="wordReport">Отчёт за месяц в Word</button></div>
    <p class="lead">Операционные показатели за последние ${r.win} дней, заполняемость — за 30 дней. Каждое число считается из данных кабинета; формула подписана под показателем.</p>
    <div class="grid g4" style="margin-top:14px">
      <div class="kpi ${fill<50?'alert':fill>=70?'ok':''}"><div class="k">Заполняемость</div><div class="v">${fill}%</div><div class="s">${Math.round(r.doneH)} состоявшихся ч ÷ ${r.openH} открытых ч</div></div>
      <div class="kpi ${pct(r.cancLate.length)>10?'alert':''}"><div class="k">Поздние отмены</div><div class="v">${pct(r.cancLate.length)}%</div><div class="s">менее ${S.settings.cancelH} ч · ${r.cancLate.length} шт.</div></div>
      <div class="kpi"><div class="k">Отмены заранее</div><div class="v">${pct(r.cancEarly.length)}%</div><div class="s">более ${S.settings.cancelH} ч · ${r.cancEarly.length} шт.</div></div>
      <div class="kpi"><div class="k">Отменил специалист</div><div class="v">${pct(r.cancSpec.length)}%</div><div class="s">${r.cancSpec.length} шт.</div></div>
      <div class="kpi ${nsPct>=10?'alert':'ok'}"><div class="k">Неявки</div><div class="v">${nsPct}%</div><div class="s">устойчивые 10 %+ — правило не работает</div></div>
      <div class="kpi ${r.lost>0?'alert':''}"><div class="k">Потери от отмен</div><div class="v">${r.lost.toLocaleString('ru-RU')}</div><div class="s">Σ пропущенных − Σ удержанного</div></div>
      <div class="kpi"><div class="k">Конверсия первичной</div><div class="v">${conv}%</div><div class="s">${r.second.length} из ${r.firsts.length} дошли до второй</div></div>
      <div class="kpi"><div class="k">Удержание</div><div class="v">${ret}%</div><div class="s">${r.keep.length} из ${r.started.length} дошли до 5 встреч</div></div>
      <div class="kpi"><div class="k">Средняя пауза</div><div class="v">${r.gap}</div><div class="s">дней между встречами; рост — ранний признак ухода</div></div>
      <div class="kpi"><div class="k">Обязательства по пакетам</div><div class="v">${r.oblig.toLocaleString('ru-RU')}</div><div class="s">₽ оплачено, не отработано</div></div>
      <div class="kpi"><div class="k">Доход за период</div><div class="v">${r.income.toLocaleString('ru-RU')}</div><div class="s">₽ по состоявшимся встречам</div></div>
      <div class="kpi"><div class="k">Поступило платежей</div><div class="v">${r.paid.toLocaleString('ru-RU')}</div><div class="s">₽ по журналу оплат за ${r.win} дней</div></div>
    </div>

    <h3>Отмены: из чего складываются</h3>
    ${[['Заранее, более '+S.settings.cancelH+' ч',r.cancEarly.length,''],['Поздние, менее '+S.settings.cancelH+' ч',r.cancLate.length,'r'],
       ['Отменил специалист',r.cancSpec.length,'o'],['Неявки',r.noShow.length,'r']].map(([n,v,c])=>`
      <div style="margin-bottom:7px"><div class="spread"><span>${n}</span><span class="mono sub">${v} · ${pct(v)}%</span></div>
      <div class="bar"><i class="${c}" style="width:${Math.min(100,pct(v)*3)}%"></i></div></div>`).join('')}
    <p class="sub">Всего встреч в периоде: ${r.all.length}, из них состоялось ${r.done.length}. Потери считаются как Σ стоимости пропущенных (${r.missed.reduce((s,v)=>s+v.price,0).toLocaleString('ru-RU')} ₽) минус Σ фактически удержанного (${r.missed.reduce((s,v)=>s+(v.charged||0),0).toLocaleString('ru-RU')} ₽).</p>

    <h3>Длительность работы по причине завершения</h3>
    <div class="tw"><table><thead><tr><th>Причина</th><th class="num">Клиентов</th><th class="num">Средняя длительность, дней</th></tr></thead>
      <tbody>${Object.keys(r.byWhy).map(k=>`<tr><td>${esc(k)}</td><td class="num">${r.byWhy[k].length}</td>
        <td class="num">${Math.round(r.byWhy[k].reduce((s,x)=>s+x,0)/r.byWhy[k].length)}</td></tr>`).join('')||'<tr><td colspan="3" class="sub">Завершённых работ пока нет</td></tr>'}</tbody></table></div>

    <h3>Что из этого следует</h3>
    <div class="list">
      <div class="item"><div>${nsPct>=10?'<b>Неявки на уровне '+nsPct+'%</b> — правило отмены не работает или не проговаривается на первой встрече.':'Неявки ниже 10% — правило отмены работает.'}</div>
        <button class="btn mini ghost" data-act="tab" data-t="help">Настройки правила</button></div>
      <div class="item"><div>Конверсия первичной во вторую — <b>${conv}%</b>. Ниже 60% обычно означает, что на первой встрече не проговорены формат, сроки и деньги.</div>
        <button class="btn mini ghost" data-act="tab" data-t="clients">Клиенты</button></div>
      <div class="item"><div>Обязательства по пакетам — <b>${rub(r.oblig)}</b>. Эти деньги нельзя считать заработанными.</div>
        <button class="btn mini ghost" data-act="tab" data-t="pay">Оплаты</button></div>
    </div>
  </div>`;
}

/* ═══════════════ Помощь и настройки ═══════════════ */
function vHelp(){
  return `<div class="card">
    <h2>Настройки кабинета</h2>
    <p class="lead">Кабинет рассчитан на частную практику одного специалиста. Психологическая помощь вне медицинской организации не является медицинской услугой: диагнозы здесь не ставятся, назначения не делаются, карта пациента не ведётся. Информированное согласие оформляется как согласие на психологическую помощь.</p>

    <h3>Специалист</h3>
    <div class="fgrid">
      <label class="f"><span>Имя специалиста</span><input data-setspec="name" value="${esc(SPEC().name)}"></label>
      <label class="f"><span>Подход, указывается в документах</span><input data-setspec="title" value="${esc(SPEC().title)}"></label>
      <label class="f"><span>Открытых часов приёма в месяц</span><input data-set="openH" type="number" value="${S.settings.openH}"></label>
    </div>

    <h3>Правила работы</h3>
    <div class="fgrid">
      <label class="f"><span>Отмена без последствий, часов до встречи</span><input data-set="cancelH" type="number" value="${S.settings.cancelH}"></label>
      <label class="f"><span>Правило при поздней отмене — предложение по умолчанию</span><select data-set="cancelRule">
        ${['списать с пакета','выставить к оплате','ничего не предлагать'].map(x=>`<option ${S.settings.cancelRule===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f"><span>Длительность встречи, мин</span><input data-set="dur" type="number" value="${S.settings.dur}"></label>
      <label class="f"><span>Стоимость встречи, ₽</span><input data-set="price" type="number" value="${S.settings.price}"></label>
      <label class="f"><span>Срок повторного замера по шкалам, дней</span><input data-set="retest" type="number" value="${S.settings.retest}"></label>
      <label class="f"><span>Блокировка кабинета при бездействии, мин</span><input data-set="lock" type="number" value="${S.settings.lock}"></label>
      <label class="f"><span>Начало приёма</span><input data-set="start" value="${esc(S.settings.start)}"></label>
      <label class="f"><span>Конец приёма</span><input data-set="end" value="${esc(S.settings.end)}"></label>
    </div>
    <div class="note">Правило отмены — это предложение системы, а не автоматическое действие. Списание с пакета или выставление к оплате выполняет специалист, и у него всегда есть кнопка «простить».</div>

    <h3>Видеовстречи</h3>
    <div class="fgrid">
      <label class="f"><span>Формат встречи по умолчанию</span><select data-set="defFmt">
        ${['очно','онлайн'].map(x=>`<option ${(S.settings.defFmt||'очно')===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f"><span>Адрес площадки видеосвязи</span><input data-set="meetBase" value="${esc(S.settings.meetBase)}"></label>
      <label class="f"><span>Код кабинета в адресе комнаты</span><input data-set="room" value="${esc(S.settings.room)}"></label>
    </div>
    <p class="lead">Код кабинета сформирован случайным образом при первом запуске. Адрес комнаты складывается из адреса площадки, кода кабинета и идентификатора клиента, поэтому у каждого клиента постоянная персональная комната — например, <span class="mono" style="word-break:break-all">${esc(meetBase()+'tochka-opory-'+S.settings.room+'-'+(S.clients[0]?S.clients[0].id:'c1'))}</span>. Если вы работаете на другой площадке, укажите собственную ссылку в карточке клиента.</p>
    <div class="note">Кабинет не подключается к площадке видеосвязи, не участвует в соединении и не хранит запись встречи. Он формирует и хранит только адрес комнаты и по нажатию открывает его в новой вкладке браузера. Всё, что происходит на встрече, остаётся между вами, клиентом и выбранной вами площадкой.</div>
    <h4 style="font-family:'Spectral';font-size:15px;margin:16px 0 6px">Как завершается встреча</h4>
    <p class="lead">При нажатии «Войти во встречу» кабинет запоминает, какая встреча начата и в котором часу, и открывает комнату в соседней вкладке. В кабинете при этом появляется закреплённая полоса состояния: она видна на всех вкладках и показывает клиента, время начала и продолжительность, которая обновляется раз в минуту.
    Из полосы доступны три действия: «Вернуться к окну встречи» открывает комнату заново, «Завершить встречу и заполнить запись» проставляет фактическую продолжительность, переводит встречу в статус «состоялась» и сразу открывает карточку записи с выбранным шаблоном, «Свернуть» убирает полосу до конца сеанса, оставляя в линии дня отметку «идёт».
    Кабинет ведёт одну встречу за раз. Если начать следующую, не завершив предыдущую, кабинет спросит об этом и предложит закрыть предыдущую с фактической продолжительностью — молча вытеснить её новой он не может.
    Отмена последнего действия полосу не гасит: отсчёт с начала встречи сохраняется.
    Состояние сохраняется вместе с базой: если вкладку кабинета закрыть и вернуться позже, полоса восстановится, а при завершении будет предложена рассчитанная продолжительность, которую можно исправить вручную в поле «Длительность факт».</p>
    <h4 style="font-family:'Spectral';font-size:15px;margin:16px 0 6px">Как ссылка попадает к клиенту</h4>
    <p class="lead">В карточке клиента указывается способ связи: WhatsApp, Telegram или электронная почта. Действие «Отправить ссылку клиенту» доступно и в карточке клиента, и в карточке встречи, и в линии дня. Оно открывает окно с готовым текстом — дата, время в часовом поясе клиента, ссылка и порядок подключения; характер встречи в тексте не указывается.
    Дальше выбирается способ отправки: WhatsApp открывается по номеру из карточки, Telegram — через окно пересылки, письмо — в почтовой программе с заполненными темой и текстом. Способ из карточки выделен как основной, остальные остаются доступны; отдельной кнопкой текст можно просто скопировать.
    Кабинет открывает выбранное приложение с подготовленным текстом, отправку подтверждает специалист; самостоятельно кабинет сообщения не отправляет. После использования любого способа в карточке встречи остаётся отметка «ссылка отправлена» с датой и временем — она видна и в линии дня. Если у онлайн-встречи ссылка не отправлена, а до начала осталось менее суток, строка об этом появляется в перечне «Нужно отметить» на вкладке «Сегодня».</p>

    <h3>Помощник на основе искусственного интеллекта</h3>
    <p class="lead">Кабинет не обращается к внешним сервисам. Он собирает текст запроса, который вы переносите в выбранный сервис самостоятельно. Обезличивание включено принудительно и не отключается: имена клиентов и законных представителей заменяются кодами во всех падежах, телефоны в любом написании и адреса электронной почты вырезаются. Проверка повторяется в момент копирования, поэтому она применяется и к тексту, который вписан в поле запроса вручную. Распознаются имена, телефоны и почта; место работы, редкие обстоятельства и прозвища кабинет распознать не может — их убирает из описания специалист. В запрос никогда не попадают тексты записей о встречах, заметки специалиста для себя, баллы опросников и отметки о риске.</p>
    <div class="list">
      <div class="item"><div><b>Домашнее задание.</b> Формулируется по теме, которую вы вписываете вручную, и по согласованным целям работы.</div>
        <button class="btn mini ghost" data-act="tab" data-t="clients">Клиенты</button></div>
      <div class="item"><div><b>Письмо клиенту.</b> Только организационные поводы: перенос встречи, правило отмены, напоминание об оплате, подтверждение записи.</div>
        <button class="btn mini ghost" data-act="tab" data-t="clients">Клиенты</button></div>
      <div class="item"><div><b>Вопрос супервизору.</b> Формулируется по обезличенному описанию случая, которое вы вводите вручную.</div>
        <button class="btn mini ghost" data-act="tab" data-t="superv">Супервизия</button></div>
    </div>

    <h3>Где что находится</h3>
    <p class="lead">Запись голосом — в карточке встречи: откройте встречу на вкладке «Сегодня» или из карточки клиента, блок «Запись голосом» находится сразу над полями записи о встрече.
    Видеовстреча — там же и в линии дня: кнопка «Войти во встречу» у встреч формата «онлайн». После нажатия в верхней части кабинета остаётся оранжевая полоса с продолжительностью встречи и кнопками «Вернуться к окну встречи» и «Завершить встречу и заполнить запись»; полоса видна на всех вкладках и сохраняется после перезагрузки страницы.
    Отправка ссылки клиенту — кнопка «Отправить ссылку клиенту» в карточке клиента, в карточке встречи и в линии дня.</p>
    <h3>Сохранность данных</h3>
    <p class="lead">Последняя копия базы: <b>${S.settings.lastBackup?ru(S.settings.lastBackup):'ещё не сохранялась'}</b>${S.settings.lastBackup&&days(S.settings.lastBackup,D(0))>=7?' — это было '+days(S.settings.lastBackup,D(0))+' дн. назад':''}. Копию следует делать раз в неделю и класть в папку, которая синхронизируется с облаком.</p>
    <p class="lead">Все записи хранятся только в этом браузере на этом устройстве и не уходят ни на какой сервер. Это не освобождает от обязанностей оператора персональных данных: устройство должно быть под паролем, диск — зашифрован, резервная копия — сделана и тоже защищена. Очистка данных браузера сотрёт базу без возможности восстановления.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn" data-act="export">Скачать копию базы</button>
      <button class="btn ghost" data-act="import">Загрузить копию</button>
      <button class="btn ghost" data-act="exportClient">Выгрузка по запросу клиента</button>
      <button class="btn ghost" data-act="anonClient">Обезличить клиента</button>
      <button class="btn ghost warn" data-act="reset">Вернуть демонстрационные данные</button>
    </div>
    <p class="sub" style="margin-top:8px">Выгрузка по запросу клиента содержит административные сведения, документы, оплаты, даты и статусы встреч и замеры по шкалам. Клиническая часть — формулировка случая, план работы и тексты записей — добавляется отдельной отметкой в окне выгрузки, по решению специалиста. Не выгружаются никогда: поле «заметка для себя», отметки о риске и записи совместных встреч парной работы.
    Обезличивание удаляет имя, телефон, адрес почты, дату рождения, сведения о законном представителе и клинические записи, сохраняя статистику встреч и оплат, чтобы отчёты за прошлые периоды не изменились.</p>

    <h3>Разделение сведений внутри карточки</h3>
    <p class="lead">Карточка клиента состоит из двух частей. Административная — контакты, расписание, оплаты, документы — нужна для организации работы. Клиническая — запрос, формулировка случая, план, флаги риска, записи о встречах — составляет содержание помощи.
    Разделение сохраняется в выгрузках и в реестре супервизии: в отчёты и в реестр случаев клиническая часть не попадает, а в выгрузку для клиента она входит только тогда, когда специалист отметил это в окне выгрузки. Рабочие заметки специалиста и отметки о риске не выгружаются ни при какой отметке.
    Практический смысл разделения — ограничить доступ посторонних к содержанию записей: если экран виден со стороны или к устройству имеет доступ кто-то ещё, включите режим «Скрыть имена», при котором во всём кабинете вместо имён отображаются коды.</p>

    <h3>Правовая рамка</h3>
    <p class="lead">Сведения о состоянии здоровья относятся к специальной категории персональных данных по 152-ФЗ. Их обработка требует отдельного письменного согласия — отдельного документа, а не строки внутри общего согласия.
    Уведомление в Роскомнадзор об обработке персональных данных подаёт любой оператор; освобождение от уведомления сохранилось фактически только для обработки без средств автоматизации, то есть на бумаге. Ведение базы в браузере — это автоматизированная обработка.
    Локальное хранение уменьшает риск утечки через сервер, но не снимает ни одной обязанности оператора: политика обработки, согласия, срок хранения, порядок уничтожения, реакция на запрос субъекта.</p>
    <p class="lead">Специалист связан профессиональной тайной и договором с клиентом. Раскрытие сведений возможно по запросу суда и в случаях угрозы жизни — и каждый такой случай фиксируется в журнале раскрытия.</p>

    <h3>Чего этот кабинет намеренно не делает</h3>
    <div class="list">
      <div class="item"><div><b>Не ставит диагнозы.</b> Шкалы дают число и диапазон; интерпретация — работа специалиста в беседе.</div></div>
      <div class="item"><div><b>Не даёт трактовок на основе искусственного интеллекта.</b> Ни предположений о состоянии, ни рекомендуемых интервенций, ни прогноза по баллу.</div></div>
      <div class="item"><div><b>Не передаёт содержание записей вовне.</b> Ни в отчёты, ни в реестр супервизии, ни в запрос помощника содержание встреч не попадает.</div></div>
      <div class="item"><div><b>Не даёт клиенту доступа к записям специалиста.</b> Кабинет предназначен только для специалиста.</div></div>
      <div class="item"><div><b>Не строит рассылки по клиническим признакам.</b> Сегментация по баллам шкал и отметкам о риске невозможна конструктивно.</div></div>

let REC=null;
const NUMW={'ноль':0,'один':1,'одна':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,
 'восемь':8,'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,
 'пятнадцать':15,'шестнадцать':16,'семнадцать':17,'восемнадцать':18,'девятнадцать':19};
/* Десятки отдельно: раньше «тридцать два» читалось как 3 — в слове узнавалось начало «три».
   Рабочий диапазон шкал ORS и SRS доходит до 40, поэтому десятки обязательны. */
const NUMT={'двадцать':20,'тридцать':30,'сорок':40,'пятьдесят':50,'шестьдесят':60,
 'семьдесят':70,'восемьдесят':80,'девяносто':90};
/* Все числа предложения с их местом в тексте: и цифрами, и словами, включая составные. */
function numsIn(t){
  const s=String(t||'').toLowerCase(),out=[];let m;
  const reD=/\d{1,3}/g;while((m=reD.exec(s)))out.push({i:m.index,v:+m[0]});
  const toks=[];const reW=/[а-яё]+/g;while((m=reW.exec(s)))toks.push({i:m.index,w:m[0]});
  for(let k=0;k<toks.length;k++){
    const w=toks[k].w;
    if(NUMT[w]!==undefined){
      const nx=toks[k+1]?NUMW[toks[k+1].w]:undefined;
      if(nx!==undefined&&nx>0&&nx<10){out.push({i:toks[k].i,v:NUMT[w]+nx});k++}
      else out.push({i:toks[k].i,v:NUMT[w]});
    }else if(NUMW[w]!==undefined)out.push({i:toks[k].i,v:NUMW[w]});
  }
  return out.sort((a,b)=>a.i-b.i);
}
function wordNum(t){const n=numsIn(t);return n.length?n[0].v:null}
const VRULES={

  theme:[/тема/i,/пришла с/i,/пришёл с/i,/запрос/i,/обратил/i,/жалу/i,/рассказ/i,/говорит/i,/говорила/i,

    /динамик/i,/наблюд/i,/выгляд/i,/в контакте/i,/темп речи/i,/заметил/i,/на вид/i],
  interv:[/сделал/i,/техник/i,/упражнен/i,/работали/i,/применил/i,/разбирали/i,/провели/i,/прояснял/i,
    /обучил/i,/предложил/i,/показал/i,/использовал/i,/эксперимент/i,/психообразован/i],
  react:[/реакц/i,/отреагиров/i,/отклик/i,/ответил/i,/расплак/i,/оживил/i,/сопротивл/i,/принял/i,
    /согласил/i,/отказал/i,/удивил/i,/отнёсся/i,/отнеслась/i,/спокойно/i,/с интересом/i],
  hw:[/домашн/i,/задани/i,/дневник/i,/практик/i,/на неделю/i,/самостоятельн/i],
  next:[/следующ/i,/встретимся/i,/план/i,/договорил/i,/продолж/i,/решили/i,/вернуться к/i,/закрепить/i,
    /проверить/i,/на следующей/i]

function splitSentences(t){
  return String(t||'').split(/(?<=[.!?…])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>2);
}
function pickKey(sent,keys){
  let best=null,bestN=0;
  keys.forEach(k=>{
    const rules=(k==='d')?[].concat(VRULES.s,VRULES.o):(VRULES[k]||[]);
    let n=0;rules.forEach(r=>{if(r.test(sent))n++});
    if(n>bestN){bestN=n;best=k}
  });
  return bestN?best:null;
}
function numFirst(t){const n=numsIn(t);return n.length?n[0].v:null}
/* Название методики распознаётся только тогда, когда оно прозвучало.
   Раньше любое «опросник», «шкала» или «балл» без названия подписывалось как PHQ-9 —
   опросник депрессии; фраза про ORS или SRS тоже становилась PHQ-9. */
const KINDW=[[/phq[\s-]?2/i,'PHQ-2'],[/gad[\s-]?2/i,'GAD-2'],[/\bors\b|орс\b/i,'ORS'],[/\bsrs\b|срс\b/i,'SRS'],
  [/phq|депресс/i,'PHQ-9'],[/gad|тревог/i,'GAD-7']];
function findScores(text){
  const out=[];
  splitSentences(text).forEach(sent=>{
    let kind=null;
    for(const [re,k] of KINDW){if(re.test(sent)){kind=k;break}}
    /* Методика не названа — балл показывается, но методику выбирает специалист. */
    if(!kind&&!/опросник|шкал|балл/i.test(sent))return;
    const clean=sent.replace(/phq[\s-]?[297]|gad[\s-]?[27]|ors|srs/gi,' ');
    const nums=numsIn(clean);
    if(!nums.length)return;
    /* Разделитель «было» искался как подстрока и срабатывал внутри слова «забыл»,
       из-за чего балл терялся целиком. Теперь слово ищется по границам и только вместе с числом. */
    const mk=clean.match(/(?:^|[^а-яё])(было|была|был|раньше|ранее|прежде|до этого)(?![а-яё])/i);
    const mi=mk?clean.indexOf(mk[1]):-1;
    const before=nums.filter(n=>mi<0||n.i<mi),after=mi<0?[]:nums.filter(n=>n.i>mi);
    const now=(before.length?before[0]:nums[0]).v;
    /* «Ранее» имеет смысл только тогда, когда до слова-разделителя балл уже прозвучал:
       во фразе «на прошлой неделе было тяжело, по опроснику девять баллов» прежнего балла нет. */
    const prev=(before.length&&after.length)?after[0].v:null;
    out.push({kind,score:now,prev});
  });
  return out;
}
function readSess(v){
  const wasDate=v.date,wasTime=v.time;
  v.date=val('v-date');v.time=val('v-time');v.dur=+val('v-dur')||v.dur;v.fact=+val('v-fact')||v.fact;
  /* Клиенту уходило письмо с прежними датой и часом: после переноса отметка об отправке
     больше не соответствует действительности и напоминание должно вернуться. */
  if(v.sent&&(v.date!==wasDate||v.time!==wasTime)){
    v.sentOld={at:v.sent,date:wasDate,time:wasTime};v.sent='';
  }
  v.type=val('v-type');v.fmt=val('v-fmt');v.link=val('v-link');v.status=val('v-status');
  v.price=+val('v-price')||0;v.pay=val('v-pay');
  if(document.getElementById('n-'+TPLS[(v.note&&v.note.tpl)||'DAP'][0][0])){
    const t=(v.note&&v.note.tpl)||'DAP';
    /* Запись собирается поверх прежней, а не с чистого листа: иначе текст полей,
       которых нет в новом шаблоне, стирался при первом же сохранении. */
    const n=Object.assign({},v.note||{},{tpl:t});
    TPLS[t].forEach(([k])=>n[k]=val('n-'+k));
    n.raw=val('n-raw');n.rest=val('n-rest');
    v.note=n;v.risk=val('v-risk');v.done=chk('v-done');v.self=val('v-self');
    v.by=val('v-by')||SPEC().name;v.upd=D(0);
  }
}

      <label class="f"><span>Шкала</span><select id="sc-k" data-reopen="1">${Object.keys(SCALES).map(x=>`<option ${k===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label class="f"><span>Дата замера</span><input id="sc-d" type="date" value="${D(0)}"></label>

    ${cfg.kind==='0-3'?'Как часто вас беспокоили следующие проблемы?':'Отметьте значение от 0 до 10, где 10 — лучше всего.'}</div>
    <div style="margin-top:12px">
    ${cfg.items.map((q,i)=>`<div class="q ${k==='PHQ-9'&&i===8?'hl':''}">
      <div class="qt"><span class="qn">${i+1}.</span>${esc(q)}</div>
      ${cfg.kind==='0-3'
        ?`<div class="opts">${O4.map((o,j)=>`<label><input type="radio" class="sc-i" name="q${i}" data-i="${i}" value="${j}" ${j===0?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`
        :`<div class="row" style="margin-top:6px"><input type="range" class="sc-i" data-i="${i}" min="0" max="10" step="1" value="5" style="flex:1;min-width:160px"><span class="mono" id="rv${i}">5</span></div>`}
      ${k==='PHQ-9'&&i===8?'<div class="sub" style="margin-top:6px">Пункт подсвечен как повод для прямого разговора. Шкала не оценивает суицидальный риск — это делает только клиническое интервью.</div>':''}
    </div>`).join('')}
    </div>
    <div class="kpi" style="margin-top:14px"><div class="k">Сумма баллов</div><div class="v" id="sc-sum">0</div>
      <div class="s" id="sc-band">${esc(band(k,0))}</div></div>
    <div class="alertbox" style="margin-top:10px">Результат — показатель в диапазоне, требующем клинической оценки. Это не диагноз и не основание для назначений.</div>
  `,`<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn" data-act="saveScale" data-kind="${k}">Сохранить замер</button>`);
  recalcScale();
}
function recalcScale(){
  const el=document.getElementById('sc-sum');if(!el)return;
  const k=val('sc-k')||'PHQ-9';
  let sum=0;
  document.querySelectorAll('.sc-i').forEach(i=>{
    if(i.type==='radio'){if(i.checked)sum+=+i.value}
    else{sum+=+i.value;const o=document.getElementById('rv'+i.dataset.i);if(o)o.textContent=i.value}
  });
  el.textContent=sum;
  const b=document.getElementById('sc-band');if(b)b.textContent=band(k,sum);
}

document.addEventListener('click',e=>{

  if(document.getElementById('modal').hidden)CTX=a+'|'+(id||'')+'|'+(S.ui.client||'');
  const A={
    tab:()=>go(el.dataset.t),
    closeModal:closeModal,
    theme:()=>{const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',cur);try{localStorage.setItem(KEY+'-theme',cur)}catch(e){}},
    anon:()=>{S.ui.anon=!S.ui.anon;closeModal();save();render();
      toast(S.ui.anon?'Имена заменены кодами во всём кабинете':'Имена показаны')},
    client:()=>{pushHist();S.ui.tab='clients';S.ui.client=id;closeModal();save();render();syncRail()},
    backClients:()=>{pushHist();S.ui.client=null;save();render();syncRail()},
    filter:()=>{S.ui.filter=el.dataset.f;save();render()},
    shift:()=>{const n=+el.dataset.n;S.ui.day=n?D(days(D(0),S.ui.day)+n):D(0);save();render()},
    openSess:()=>sessModal(id),
    prevNote:()=>sessModal(id),
    newSess:()=>newSessModal(el.dataset.date,el.dataset.cid,el.dataset.time),
    openMeet:()=>{const v=sess(id);const u=meetUrl(v);if(!u){toast('Адрес комнаты не задан');return}
      /* Если идёт другая встреча, startMeet открывает вопрос и возвращает false — комнату не открываем. */
      if(!startMeet(v))return;
      closeModal();render();
      window.open(u,'_blank','noopener');
      toast('Комната открыта. Полоса состояния вверху остаётся до завершения встречи')},
    openMeetC:()=>{const c=cl(id);const u=roomUrl(c);if(!u){toast('Адрес комнаты не задан');return}
      const v=S.sessions.filter(x=>x.cid===c.id&&x.date===D(0)&&(x.status==='запланирована'||x.status==='подтверждена'))
        .sort((a,b)=>a.time<b.time?-1:1)[0];
      if(v&&!startMeet(v))return;
      closeModal();render();window.open(u,'_blank','noopener');
      toast(v?'Комната открыта. Полоса состояния вверху остаётся до завершения встречи':'Комната открыта в новой вкладке')},
    /* Переход от одной встречи к следующей: предыдущая закрывается с фактической продолжительностью. */
    meetSwitch:()=>{
      const next=sess(id);const cur=S.ui.meet?sess(S.ui.meet.id):null;
      const mins=meetMins();
      if(cur)finishMeet(cur,mins);
      closeModal();
      if(!next){render();return}
      startMeet(next,true);render();
      const u=meetUrl(next);if(u)window.open(u,'_blank','noopener');
      toast('Предыдущая встреча завершена: '+mins+' мин. Начата встреча: '+title(next))},
    meetBack:()=>{const v=sess(id)||(S.ui.meet?sess(S.ui.meet.id):null);const u=meetUrl(v);
      if(!u){toast('Адрес комнаты не задан');return}
      window.open(u,'_blank','noopener');toast('Окно встречи открыто заново')},
    meetHide:()=>{MEET_HIDDEN=true;renderMeetBar();toast('Полоса свёрнута. Встреча продолжается — отметка «идёт» осталась в линии дня')},
    meetEnd:()=>{
      const v=sess(id)||(S.ui.meet?sess(S.ui.meet.id):null);if(!v)return;
      const mins=meetMins();
      finishMeet(v,mins);render();
      sessModal(v.id);
      toast('Встреча завершена. Фактическая продолжительность '+mins+' мин — исправьте, если нужно')},
    sendLink:()=>sendSheet(sess(id),sess(id)&&sess(id).cid?cl(sess(id).cid):null),
    sendLinkC:()=>{const c=cl(id);

        .sort((a,b)=>a.date<b.date?-1:1)[0];

    sendVia:()=>{

      const text=val('msg-t')||(v?meetInvite(v):c?meetInviteC(c):'');

      if(via==='copy'){copyText(text);markSent(v);render();toast('Текст скопирован'+(v?' · отметка об отправке сохранена':''));return}
      const u=sendUrl(via,c,link,text);
      if(!u||/\/\/?\?|mailto:\?/.test(u)){toast('В карточке клиента не хватает данных для этого способа');return}
      window.open(u,'_blank','noopener');
      markSent(v);render();
      toast((via==='wa'?'WhatsApp':via==='tg'?'Telegram':'Почтовая программа')+' открыта с подготовленным текстом'+(v?' · отметка об отправке сохранена':''))},
    wait:()=>{
      const list=S.wait.map(w=>nm(cl(w.cid))).join(', ');
      modal('Освободилось окно',`<p class="lead">Окно ${ru(el.dataset.date)} в ${esc(el.dataset.time)}. В листе ожидания: <b>${esc(list||'никого')}</b>.</p>
        <label class="f" style="margin-top:10px"><span>Готовый текст</span><textarea id="msg-t" style="min-height:90px">Здравствуйте. Освободилось время ${ru(el.dataset.date)} в ${esc(el.dataset.time)}. Если оно вам подходит, напишите — оставлю его за вами.</textarea></label>
        <div class="note">Кабинет намеренно не пишет клиентам сам: текст готовится, отправляете вы.</div>`,
        `<button class="btn ghost" data-act="closeModal">Закрыть</button><button class="btn" data-act="copyMsg">Скопировать</button>`)},
    copyMsg:()=>{copyText(val('msg-t'));toast('Текст скопирован')},
    newClient:()=>clientModal(null),
    editClient:()=>clientModal(id),
    tplSet:()=>{const v=sess(id);readSess(v);v.note=Object.assign({},v.note||{},{tpl:el.dataset.tpl});save();sessModal(id)},
    saveSess:()=>{const v=sess(id);readSess(v);save();closeModal();render();toast('Запись о встрече сохранена')},
    cancelSess:()=>{const v=sess(id);readSess(v);save();cancelModal(id)},
    doCancel:()=>{
      const v=sess(id),rule=el.dataset.rule;
      v.status=val('x-who')||'отменена клиентом';v.reason=val('x-why');
      v.before=Math.max(0,Math.round(hoursTo(v)));
      if(rule==='pack'){const p=pack(v.cid)[0];if(p&&p.used<p.n)p.used++;v.charged=v.price;v.pay='пакет';v.rule='поздняя отмена, списано с пакета'}
      else if(rule==='bill'){const c=cl(v.cid);c.debt=(c.debt||0)+v.price;v.charged=v.price;v.pay='долг';v.rule='поздняя отмена, выставлено к оплате'}
      else if(rule==='forgive'){v.charged=0;v.pay='';v.rule='поздняя отмена, прощено специалистом'}
      else{v.charged=0;v.pay='';v.rule='отмена заранее, без удержания'}
      save();closeModal();render();
      toast(rule==='forgive'?'Отмена прощена — ничего не удержано':'Встреча отменена: '+v.rule)},
    /* Обезличивание применяется в момент копирования, иначе ручная правка поля уезжала в буфер как есть. */
    aiCopy:()=>{const el=document.getElementById('ai-t');const raw=el.value,clean=anon(raw);
      if(clean!==raw)el.value=clean;
      copyText(clean);
      toast(clean!==raw
        ? 'Из запроса убраны имя, телефон и адрес почты — скопирован обезличенный текст'
        : 'Запрос скопирован. Перенесите его в выбранный сервис')},
    aiHome:()=>{
      const v=sess(id);if(!v)return;
      const c=v.cid?cl(v.cid):null;
      const SCRUB=/PHQ|GAD|ORS|SRS|балл|шкал/i;
      const gl=c?(c.goals||[]).filter(g=>!SCRUB.test(g)):[];
      const cut=c?(c.goals||[]).length-gl.length:0;
      const goals=(gl.length?gl.map(g=>'- '+g).join('\n'):'- цели работы пока не сформулированы')
        +(cut?'\n(ещё '+cut+' цели сформулированы через числовые показатели и в запрос не включены)':'');
      const mk=theme=>'Сформулируйте домашнее задание для клиента после консультации психолога.\n\n'
        +'Тема встречи: '+(theme||'(формулировка вводится специалистом)')+'\n'
        +'Тип встречи: '+v.type+', формат: '+v.fmt+(v.gid?'':', встреча № '+sessNum(v))+'\n'
        +'Цели работы, о которых договорились с клиентом:\n'+goals+'\n\n'
        +'Нужно: два-три варианта короткого выполнимого задания на неделю, каждое — одно действие и способ его отметить. '
        +'Формулировки — нейтральные, без оценок и без обещаний результата. Не предлагай диагнозов и методов лечения.';
      aiModal('Домашнее задание — запрос для ИИ',mk(''),
        `<label class="f"><span>Тема встречи одной фразой — подставится в запрос</span><input id="ai-theme" placeholder="например: границы в разговоре с руководителем"></label>
         <p class="sub" style="margin:-4px 0 8px">Тему вписывает специалист. Кабинет не берёт её из записи о встрече — содержание записей в запрос не попадает.</p>`);
      const box=document.getElementById('ai-t'),th=document.getElementById('ai-theme');
      if(th)th.addEventListener('input',()=>{box.value=anon(mk(th.value))});},

    wordReport:()=>{

      const pc=n=>r.all.length?Math.round(n/r.all.length*100):0;
      const conv=r.firsts.length?Math.round(r.second.length/r.firsts.length*100):0;
      const keep=r.started.length?Math.round(r.keep.length/r.started.length*100):0;
      let h='<h1>Отчёт кабинета за месяц</h1>';
      h+='<p class="muted">Кабинет «'+esc(S.settings.name)+'». Сформировано '+ru(D(0))+'. Период операционных показателей — последние '+r.win+' дней, заполняемость — последние 30 дней.</p>';
      h+='<p class="muted">В отчёте нет ни одного имени клиента и ни одной клинической записи: только агрегированные числа.</p>';
      h+='<h2>Заполняемость и объём</h2><table>'
        +'<tr><th>Заполняемость</th><td>'+fill+' % ('+Math.round(r.doneH)+' состоявшихся часов ÷ '+r.openH+' открытых часов)</td></tr>'
        +'<tr><th>Встреч в периоде</th><td>'+r.all.length+', из них состоялось '+r.done.length+'</td></tr>'
        +'<tr><th>Средняя пауза между встречами</th><td>'+r.gap+' дней</td></tr></table>';
      h+='<h2>Отмены и неявки</h2><table><tr><th>Показатель</th><th>Штук</th><th>Доля</th></tr>'
        +'<tr><td>Отмены заранее (более '+S.settings.cancelH+' ч)</td><td>'+r.cancEarly.length+'</td><td>'+pc(r.cancEarly.length)+' %</td></tr>'
        +'<tr><td>Поздние отмены (менее '+S.settings.cancelH+' ч)</td><td>'+r.cancLate.length+'</td><td>'+pc(r.cancLate.length)+' %</td></tr>'
        +'<tr><td>Отменил специалист</td><td>'+r.cancSpec.length+'</td><td>'+pc(r.cancSpec.length)+' %</td></tr>'
        +'<tr><td>Неявки</td><td>'+r.noShow.length+'</td><td>'+pc(r.noShow.length)+' %</td></tr></table>';
      h+='<p>Потери от отмен: <b>'+r.lost.toLocaleString('ru-RU')+' ₽</b> — сумма стоимости пропущенных встреч ('
        +r.missed.reduce((a,v)=>a+v.price,0).toLocaleString('ru-RU')+' ₽) за вычетом фактически удержанного ('
        +r.missed.reduce((a,v)=>a+(v.charged||0),0).toLocaleString('ru-RU')+' ₽).</p>';
      h+='<h2>Удержание</h2><table>'
        +'<tr><th>Конверсия первичной во вторую</th><td>'+conv+' % ('+r.second.length+' из '+r.firsts.length+')</td></tr>'
        +'<tr><th>Удержание (5 и более встреч)</th><td>'+keep+' % ('+r.keep.length+' из '+r.started.length+')</td></tr>'
        +'<tr><th>Обязательства по неиспользованным пакетам</th><td>'+r.oblig.toLocaleString('ru-RU')+' ₽</td></tr></table>';
      h+='<h2>Деньги</h2><table>'
        +'<tr><th>Доход за период по состоявшимся встречам</th><td>'+r.income.toLocaleString('ru-RU')+' \u20BD</td></tr>'
        +'<tr><th>Поступило платежей за период</th><td>'+r.paid.toLocaleString('ru-RU')+' \u20BD</td></tr>'
        +'<tr><th>Обязательства по неиспользованным пакетам</th><td>'+r.oblig.toLocaleString('ru-RU')+' \u20BD</td></tr></table>';
      toWord('otchet-kabineta-'+D(0),h)},

    voiceStart:()=>{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){toast('Распознавание речи доступно в браузере Chrome при подключении к интернету. Введите текст вручную');return}
      const box=document.getElementById('n-raw');if(!box)return;
      try{if(REC){REC.stop();REC=null}}catch(e){}
      REC=new SR();REC.lang='ru-RU';REC.continuous=true;REC.interimResults=false;
      REC.onresult=(ev)=>{let add='';
        for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)add+=ev.results[i][0].transcript+' '}
        if(add){box.value=(box.value?box.value.trim()+' ':'')+add.trim();saveDraft()}};
      REC.onerror=()=>{toast('Не удалось распознать речь. Проверьте доступ к микрофону и подключение');
        const b=document.getElementById('voice-btn');if(b)b.textContent='Записать голосом'};
      REC.onend=()=>{const b=document.getElementById('voice-btn');if(b)b.textContent='Записать голосом'};
      REC.start();
      const b=document.getElementById('voice-btn');if(b)b.textContent='Идёт запись — говорите';
      toast('Идёт запись. Нажмите «Остановить», когда закончите')},
    voiceStop:()=>{try{if(REC)REC.stop()}catch(e){}REC=null;
      const b=document.getElementById('voice-btn');if(b)b.textContent='Записать голосом';toast('Запись остановлена')},
    voiceParse:()=>{
      const v=sess(id);if(!v)return;
      const box=document.getElementById('n-raw');if(!box||!box.value.trim()){toast('Сначала наговорите или впишите текст в поле «Свободный рассказ»');return}
      const tpl=(v.note&&v.note.tpl)||'DAP';
      const keys=TPLS[tpl].map(x=>x[0]);
      const buckets={};keys.forEach(k=>buckets[k]=[]);
      const rest=[];
      splitSentences(box.value).forEach(sent=>{
        const k=pickKey(sent,keys);
        if(k)buckets[k].push(sent);else rest.push(sent);
      });
      let filled=0;
      keys.forEach(k=>{
        if(!buckets[k].length)return;
        const el2=document.getElementById('n-'+k);if(!el2)return;
        const add=buckets[k].join(' ');
        el2.value=el2.value.trim()?el2.value.trim()+'\n'+add:add;filled++;
      });
      const restEl=document.getElementById('n-rest');
      if(restEl){const add=rest.join(' ');
        if(add)restEl.value=restEl.value.trim()?restEl.value.trim()+'\n'+add:add}
      const found=findScores(box.value);
      const fb=document.getElementById('voice-found');
      /* Методика не подставляется за специалиста: если название не прозвучало, её нужно выбрать. */
      if(fb)fb.innerHTML=found.length?`<div class="okbox" style="margin-top:10px"><b>В сказанном есть числа, похожие на баллы.</b> Кабинет их не толкует: проверьте методику и решите, вносить ли замер. Сумма со слов не заменяет заполнение опросника по пунктам.
        <div class="list" style="margin-top:8px">${found.map((f,fi)=>{
          const over=f.kind&&SCALES[f.kind]&&f.score>SCALES[f.kind].max;
          return `<div class="item"><div><b>${f.score}</b> ${f.prev!==null&&f.prev!==undefined?'(ранее '+f.prev+')':''}
            ${f.kind?'· методика названа в тексте':'· <b>методика в тексте не названа</b>'}
            ${over?'<div class="sub" style="color:var(--warn)">Больше максимума методики ('+SCALES[f.kind].max+') — проверьте, о какой шкале речь.</div>':''}</div>
          <label class="f" style="margin:6px 0 0"><span>Методика</span><select id="vs-k${fi}">
            ${f.kind?'':'<option value="">— выберите методику —</option>'}
            ${Object.keys(SCALES).map(k=>`<option value="${k}" ${k===f.kind?'selected':''}>${esc(SCALES[k].title)}</option>`).join('')}
          </select></label>
          <div class="row"><button class="btn mini" data-act="voiceScale" data-cid="${v.cid}" data-sel="vs-k${fi}" data-score="${f.score}">Внести замер со слов</button>
          <button class="btn mini ghost" data-act="fillScale" data-cid="${v.cid}" data-sel="vs-k${fi}">Заполнить по пунктам</button></div></div>`}).join('')}</div></div>`:'';
      saveDraft();
      toast(filled?'Разложено по частям: '+filled+(rest.length?'. Не разобрано предложений: '+rest.length:''):'Ничего не удалось отнести — всё в поле «Не разобрано»')},
    voiceScale:()=>{
      const k=el.dataset.sel?val(el.dataset.sel):el.dataset.kind;
      if(!k){toast('Выберите методику: по одному числу кабинет её не определяет');return}
      const sc=+el.dataset.score,cfg=SCALES[k];
      if(cfg&&sc>cfg.max){toast('Не внесено: '+sc+' больше максимума методики '+k+' ('+cfg.max+')');return}
      const m={id:uid(),cid:el.dataset.cid,kind:k,date:D(0),score:sc,items:null,src:'со слов'};
      S.scales.push(m);S.ui.chartC=m.cid;save();
      toast(k+': замер со слов внесён, сумма '+sc)},
    fillScale:()=>{const k=el.dataset.sel?val(el.dataset.sel):el.dataset.kind;
      if(!k){toast('Выберите методику');return}
      closeModal();scaleModal(id||el.dataset.cid,k)},
    saveScale:()=>{
      const k=val('sc-k')||el.dataset.kind,cfg=SCALES[k];
      const items=new Array(cfg.items.length).fill(0);
      document.querySelectorAll('.sc-i').forEach(i=>{
        if(i.type==='radio'){if(i.checked)items[+i.dataset.i]=+i.value}else items[+i.dataset.i]=+i.value});
      const score=items.reduce((s,x)=>s+x,0);
      const m={id:uid(),cid:val('sc-c'),kind:k,date:val('sc-d')||D(0),score,items};
      S.scales.push(m);S.ui.chartC=m.cid;save();closeModal();render();
      toast(k+': сумма '+score+' из '+cfg.max+' — '+band(k,score))},
