        <label class="f"><span>Клиент</span><select id="ds-c">${S.clients.map(c=>`<option value="${c.id}">${esc(nm(c))}</option>`).join('')}</select></label>
        <label class="f"><span>Дата</span><input id="ds-d" type="date" value="${D(0)}"></label>
      </div>
      <label class="f"><span>Кому переданы сведения</span><input id="ds-w" placeholder="клиенту лично, законному представителю, по запросу суда"></label>
      <label class="f"><span>Основание</span><input id="ds-b" placeholder="письменный запрос клиента, согласие, требование суда"></label>
      <label class="f"><span>Объём</span><textarea id="ds-v" placeholder="что именно передано и что не передавалось"></textarea></label>`,
      `<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn" data-act="saveDisc">Записать</button>`),
    saveDisc:()=>{S.disc.push({id:uid(),date:val('ds-d'),cid:val('ds-c'),who:val('ds-w'),base:val('ds-b'),vol:val('ds-v')});
      save();closeModal();render();toast('Раскрытие зафиксировано')},
    newPay:()=>modal('Оплата',`
      <div class="fgrid">
        <label class="f"><span>Клиент</span><select id="py-c">${S.clients.map(c=>`<option value="${c.id}">${esc(nm(c))}</option>`).join('')}</select></label>
        <label class="f"><span>Дата</span><input id="py-d" type="date" value="${D(0)}"></label>
        <label class="f"><span>Сумма, ₽</span><input id="py-s" type="number" value="${S.settings.price}"></label>
        <label class="f"><span>Способ</span><select id="py-m"><option>СБП</option><option>карта</option><option>наличные</option><option>перевод</option></select></label>
        <label class="f"><span>Встреча</span><select id="py-v"><option value="">не привязывать</option>${S.sessions.filter(v=>v.status==='состоялась').slice(-25).reverse().map(v=>`<option value="${v.id}">${ru(v.date)} ${v.time} · ${esc(title(v))}</option>`).join('')}</select></label>
      </div>
      <label class="f"><span>Комментарий</span><input id="py-t"></label>
      <div class="note">Назначение платежа в чеке — «Консультация». Нейтральная формулировка выбрана намеренно: чек попадает в банковскую выписку и в приложение оператора фискальных данных.</div>`,
      `<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn" data-act="savePay">Записать</button>`),
    savePay:()=>{S.pays.push({id:uid(),cid:val('py-c'),date:val('py-d'),sum:+val('py-s')||0,method:val('py-m'),
      sid:val('py-v'),check:false,purpose:'Консультация',comment:val('py-t')});save();closeModal();render();toast('Оплата записана')},
    check:()=>{const p=S.pays.find(x=>x.id===id);p.check=true;save();render();toast('Чек отмечен как выданный')},
    usePack:()=>{const p=S.packs.find(x=>x.id===id);if(p.used>=p.n){toast('Пакет израсходован');return}p.used++;save();render();toast('Списана одна встреча из пакета')},
    payDebt:()=>{const c=cl(id);S.pays.push({id:uid(),cid:c.id,date:D(0),sum:c.debt,method:'СБП',sid:'',check:false,purpose:'Консультация',comment:'Погашение задолженности'});
      c.debt=0;save();render();toast('Задолженность погашена, оплата записана')},
    forgiveDebt:()=>{const c=cl(id);c.debt=0;save();render();toast('Задолженность списана решением специалиста')},
    newSup:()=>modal('Случай на супервизию',`
      <div class="fgrid">
        <label class="f"><span>Код клиента</span><select id="sv-c">${S.clients.map(c=>`<option value="${c.code}">${esc(c.code)}</option>`).join('')}</select></label>
        <label class="f"><span>Дата</span><input id="sv-d" type="date" value="${D(0)}"></label>
        <label class="f"><span>Супервизор</span><input id="sv-s"></label>
        <label class="f"><span>Часов</span><input id="sv-h" type="number" step="0.5" value="1.5"></label>
      </div>
      <label class="f"><span>Краткая формулировка — обезличенно</span><textarea id="sv-b"></textarea></label>
      <label class="f"><span>Вопрос супервизору</span><textarea id="sv-q"></textarea></label>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="sv-k" style="width:auto;margin-right:7px">Клиент дал согласие на обсуждение случая в обезличенном виде</label>
      <div class="alertbox" style="margin-top:10px">Без отметки о согласии случай сохраняется, но помечается как недопустимый к обсуждению. Имя клиента в этот раздел не переносится.</div>`,
      `<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn" data-act="saveSup">Внести</button>`),
    saveSup:()=>{S.superv.push({id:uid(),code:val('sv-c'),date:val('sv-d'),sup:val('sv-s'),hours:+val('sv-h')||0,
      consent:chk('sv-k'),brief:val('sv-b'),q:val('sv-q'),rec:'',chg:''});save();closeModal();render();toast('Случай внесён в реестр')},
    addWait:()=>modal('Лист ожидания',`
      <label class="f"><span>Клиент</span><select id="w-c">${S.clients.map(c=>`<option value="${c.id}">${esc(nm(c))}</option>`).join('')}</select></label>
      <label class="f"><span>Что подходит</span><input id="w-t" placeholder="будни после 18:00, онлайн"></label>`,
      `<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn" data-act="saveWait">Добавить</button>`),
    saveWait:()=>{S.wait.push({id:uid(),cid:val('w-c'),want:val('w-t')||'любое время',added:D(0)});save();closeModal();render()},
    delWait:()=>{S.wait=S.wait.filter(w=>w.id!==id);save();render()},
    export:()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tochka-opory-'+D(0)+'.json';a.click();
      S.settings.lastBackup=D(0);save();render();
      toast('Копия сохранена — положите файл в папку, которая синхронизируется с облаком')},
    /* Файл проверяется до замены базы: посторонний файл не должен стирать данные. */
    import:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';
      i.onchange=()=>{const r=new FileReader();r.onload=()=>{
        let d=null;
        try{d=JSON.parse(r.result)}catch(e){alert('Файл не является копией базы: содержимое не читается. База не изменена.');return}
        if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.clients)||!Array.isArray(d.sessions)){
          alert('Файл не является копией базы кабинета «Точка опоры». База не изменена.\n\nОбратите внимание: выгрузка по запросу клиента — тоже файл .json, но копией базы она не является.');return}
        const skl=(n,a,b,c)=>{const n1=n%10,n2=n%100;return n+' '+(n2>=11&&n2<=14?c:n1===1?a:n1>=2&&n1<=4?b:c)};
        const свод=o=>skl((o.clients||[]).length,'клиент','клиента','клиентов')+', '+skl((o.sessions||[]).length,'встреча','встречи','встреч');
        const было=свод(S),станет=свод(d);
        /* Недостающие разделы восполняются пустыми, чтобы копия постарше открылась без сбоя. */
        const base=seed();
        Object.keys(base).forEach(k=>{if(d[k]===undefined)d[k]=Array.isArray(base[k])?[]:base[k]});
        d.ui=Object.assign({},base.ui,d.ui||{});d.ui.drafts={};
        d.settings=Object.assign({},base.settings,d.settings||{});
        if(!confirm('Заменить всё содержимое кабинета данными из файла?\n\nСейчас в кабинете: '+было+'.\nВ файле: '+станет+'.\n\nТекущие данные будут заменены. Отменить замену можно кнопкой «Отменить» в боковой панели, пока страница не закрыта.'))return;
        try{S=d;save();render();toast('Копия загружена: '+станет)}
        catch(e){alert('Копию загрузить не удалось. База не изменена.')}};
        r.readAsText(i.files[0])};i.click()},
    exportClient:()=>modal('Выгрузка данных по запросу клиента',`
      <label class="f"><span>Клиент</span><select id="ex-c">${S.clients.map(c=>`<option value="${c.id}">${esc(nm(c))}</option>`).join('')}</select></label>
      <div class="note">Войдут всегда: административная карточка, документы и согласия, оплаты, даты и статусы встреч, замеры по шкалам — это ответы самого клиента.
      Не войдут никогда: поле «заметка для себя», отметки о риске и совместные записи парной работы — записи о встрече с двумя участниками принадлежат обоим, и передать их одному без согласия второго нельзя.</div>
      <label class="chip" style="cursor:pointer;margin:8px 0"><input type="checkbox" id="ex-clin" style="width:auto;margin-right:6px">Добавить клиническую часть карточки и тексты записей о встречах</label>
      <p class="sub" style="margin:-2px 0 0">Формулировка случая, план работы и записи о встречах написаны специалистом для работы и супервизии. Решение о том, передавать ли их клиенту на руки, принимает специалист, а не кабинет: по умолчанию они в файл не включаются.</p>`,
      `<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn" data-act="doExportClient">Сформировать файл</button>`),
    doExportClient:()=>{
      const cid=val('ex-c'),c=cl(cid);
      const clin=!!(document.getElementById('ex-clin')||{}).checked;
      /* Административная часть собирается по перечню полей, а не копированием карточки целиком:
         иначе в файл попадают флаги риска, противопоказания и план работы. */
      const card={код:c.code,имя:c.name,'дата рождения':c.birth||'',телефон:c.phone||'',почта:c.email||'',
        'способ связи':c.msg||c.contact||'','формат работы':c.fmt||'','часовой пояс':c.tz||'',
        статус:c.status||'','стоимость встречи':c.rate,задолженность:c.debt,'работа с':c.since||'',
        'работа завершена':c.end||'','причина завершения':c.endWhy||''};
      if(c.minor)card['законный представитель']={имя:c.guardian.name,'кем приходится':c.guardian.rel,телефон:c.guardian.phone};
      if(clin)card['клиническая часть']={запрос:c.req||'',формулировка:c.form||'',контекст:c.ctx||'',
        'предыдущий опыт помощи':c.prev||'',цели:c.goals||[],'план работы':c.plan||[],противопоказания:c.contra||''};
      let pairHid=0;
      const out={клиент:card,
        документы:clientDocs(cid).map(d=>({документ:tpl(d.tid).name,версия:tpl(d.tid).ver,подписан:d.d,статус:d.st})),
        оплаты:S.pays.filter(p=>p.cid===cid),шкалы:mScales(cid),
        встречи:cSess(cid).map(v=>{
          const o={дата:v.date,время:v.time,'тип встречи':v.type,формат:v.fmt,статус:v.status,
            'длительность, мин':v.fact||v.dur,стоимость:v.price,оплата:v.pay,специалист:v.by};
          /* Совместная встреча числится за одним из партнёров, второму подтягивается по связке.
             Её запись рассказывает об обоих — в выгрузку одному участнику она не идёт. */
          const own=v.cid===cid&&!v.partner&&!v.gid;
          if(!own){pairHid++;o['запись о встрече']='совместная встреча — запись касается обоих участников и по запросу одного не выдаётся';}
          else if(clin&&v.note)o['запись о встрече']=v.note;
          return o})};
      const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vygruzka-'+c.code+'-'+D(0)+'.json';a.click();
      closeModal();
      toast('Файл сформирован'+(clin?' с клинической частью':' — только административные сведения')
        +'. Заметки для себя и отметки о риске исключены'+(pairHid?'; совместных записей скрыто: '+pairHid:''))},
    anonClient:()=>modal('Обезличивание клиента',`
      <label class="f"><span>Клиент</span><select id="an-c">${S.clients.map(c=>`<option value="${c.id}">${esc(nm(c))}</option>`).join('')}</select></label>
      <div class="alertbox">Действие необратимо. Будут удалены имя, телефон, адрес электронной почты, дата рождения, сведения о законном представителе, запрос, формулировка, контекст, план и все записи о встречах.
      Останутся: код, даты и статусы встреч, суммы оплат — чтобы отчёты за прошлые периоды не изменились задним числом.</div>`,
      `<button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn warn" data-act="doAnon">Обезличить</button>`),
    doAnon:()=>{const c=cl(val('an-c'));
      c.name=c.code;c.phone='';c.req='';c.form='';c.ctx='';c.prev='';c.contra='';c.goals=[];c.plan=[];c.risks=[];c.toParent='';
      /* Почта, дата рождения и контакты представителя указывают на человека не хуже имени —
         без них обезличивания не происходило. */
      c.email='';c.birth='';c.link='';c.guardian={name:'',rel:'',phone:''};
      /* Чистятся записи, числящиеся за этим клиентом. Встречи, где он второй участник,
         принадлежат карточке партнёра — стирать их значило бы обезличить заодно и его. */
      const own=S.sessions.filter(v=>v.cid===c.id);
      own.forEach(v=>{v.note=null;v.self='';v.done=false});
      /* Черновик открытой формы переживал обезличивание и возвращал стёртый текст обратно. */
      if(S.ui.drafts){const ids=[c.id].concat(own.map(v=>v.id));
        Object.keys(S.ui.drafts).forEach(k=>{if(ids.some(x=>k.indexOf('|'+x+'|')>=0||k.endsWith('|'+x)))delete S.ui.drafts[k]})}
      S.scales=S.scales.filter(m=>m.cid!==c.id);
      save();closeModal();render();toast('Клиент обезличен, статистика сохранена')},
    reset:()=>{if(confirm('Вернуть демонстрационные данные? Всё, что вы ввели, будет стёрто.')){S=seed();save();render();toast('Демонстрационные данные восстановлены')}}
  };
  if(A[a]){e.preventDefault();if(MUT.has(a))pushUndo(MUTL[a]||'');
    /* Черновик стирается по ключу, снятому до закрытия окна, — иначе он оставался бы в базе навсегда. */
    const kBefore=draftKey();
    A[a]();
    if(MUT.has(a)&&kBefore&&S.ui.drafts){delete S.ui.drafts[kBefore];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(err){}}}
});

/* Настройка — такое же изменение, как любое другое: раньше она сохранялась мимо цепочки отмены,
   поэтому отменить её было нечем, а нажатие «Отменить» откатывало более раннее действие. */
const setLabel=t=>{const l=t.closest('label'),sp=l&&l.querySelector('span');
  return 'настройка'+(sp?' «'+sp.textContent.replace(/,\s*[^,]*$/,'').trim()+'»':'')};
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.setspec){pushUndo(setLabel(t));S.settings.spec[t.dataset.setspec]=t.value;save();toast('Сохранено');
    setTimeout(renderHead,0);return}
  if(t.dataset&&t.dataset.set){pushUndo(setLabel(t));S.settings[t.dataset.set]=t.type==='number'?+t.value:t.value;save();toast('Сохранено');
    if(['defFmt','meetBase','room','openH','retest','cancelH','start','end'].includes(t.dataset.set))setTimeout(render,0);
    return}
  if(t.dataset&&t.dataset.setui){S.ui[t.dataset.setui]=t.value;S.ui.client=null;save();render();return}
  if(t.id==='sc-k'){scaleModal(val('sc-c'),t.value);return}
  if(t.classList&&t.classList.contains('sc-i'))recalcScale();
});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('sc-i'))recalcScale()});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
document.getElementById('back').addEventListener('click',goBack);
document.getElementById('undo').addEventListener('click',doUndo);
document.getElementById('redo').addEventListener('click',doRedo);
document.getElementById('theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);try{localStorage.setItem(KEY+'-theme',cur)}catch(e){}});
function inField(t){if(!t)return false;const n=(t.tagName||'').toLowerCase();
  return n==='input'||n==='textarea'||n==='select'||t.isContentEditable===true}
document.addEventListener('keydown',e=>{
  const typing=inField(e.target)||inField(document.activeElement);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){if(typing)return;e.preventDefault();doUndo()}
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){if(typing)return;e.preventDefault();doRedo()}
  if(e.key==='Escape')closeModal();
});
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();saveMark();syncRail();
</script>
</body>
